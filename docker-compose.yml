services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: bodega_db
      POSTGRES_USER: bodega_user
      POSTGRES_PASSWORD: bodega_pass
    ports:
      - "5432:5432"
    volumes:
      - bodega_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodega_user -d bodega_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: bodega_db
      DB_USER: bodega_user
      DB_PASSWORD: bodega_pass
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  bodega_pgdata:
